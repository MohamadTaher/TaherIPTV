<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Source for app/icon.png. Render with: python -I tools/make_icon.py -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset=".55" stop-color="#ffb52e"/>
      <stop offset="1" stop-color="#e8890c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f3a"/>
      <stop offset="1" stop-color="#14171e"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffa51f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- amber tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <path d="M128 16h256a112 112 0 0 1 112 112v20C400 120 112 120 16 148v-20A112 112 0 0 1 128 16z" fill="url(#gloss)"/>

  <!-- TV: dark screen with a thin bezel -->
  <rect x="92" y="122" width="328" height="220" rx="34" fill="#17120a" fill-opacity=".9"/>
  <rect x="106" y="136" width="300" height="192" rx="24" fill="url(#screen)"/>
  <!-- play mark, rounded corners -->
  <path d="M227 186.5c0-9.2 10-15 18-10.4l64 37c8 4.6 8 16.2 0 20.8l-64 37c-8 4.6-18-1.2-18-10.4z" fill="url(#play)"/>
  <!-- live dot -->
  <circle cx="380" cy="162" r="9" fill="#ff5b5b"/>

  <!-- stand -->
  <path d="M236 342h40l8 34h-56z" fill="#17120a" fill-opacity=".9"/>
  <rect x="172" y="372" width="168" height="22" rx="11" fill="#17120a" fill-opacity=".9"/>
</svg>
